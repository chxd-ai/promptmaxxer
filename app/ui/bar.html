<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>promptmaxxer bar</title>
<meta name="viewport" content="width=560">
<link rel="stylesheet" href="shared.css">
<style>
/* Transparent always-on-top window, about 560 x 220. Only the card is painted. */
html,body{background:transparent;width:560px;height:220px;overflow:hidden}
html.mock body{background:var(--s)}           /* browser preview: show it on the surface */
body{padding:14px 26px 26px 14px}
.fbar{width:520px;height:180px;border-radius:34px;background:var(--s);padding:12px 16px 12px;display:flex;flex-direction:column;gap:8px;
  box-shadow:8px 8px 16px #B5BBC6,-6px -6px 14px var(--hi);animation:rise .32s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(4px) scale(.985)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:11px;height:32px;-webkit-app-region:drag}
.logo{width:32px;height:32px;border-radius:50%;box-shadow:var(--raise-xs);display:grid;place-items:center;flex:none}
.logo img{width:20px;height:20px}
.logo .ic{font:700 14px/1 var(--round);color:var(--soft)}
.fbar.error .logo{box-shadow:var(--press-s)}
.ttl{flex:1;min-width:0}
.ttl b{display:flex;align-items:center;gap:8px;font:600 14px/1.15 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font:500 11px/1.3 var(--round);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{height:28px;padding:0 12px;gap:7px;font-size:11.5px;max-width:236px;flex:none;-webkit-app-region:no-drag;cursor:pointer}
.chip span.t{overflow:hidden;text-overflow:ellipsis}
.chip.open{box-shadow:var(--raise-xs)}
.chip .dot{width:7px;height:7px}
.stream{height:64px;border-radius:20px;box-shadow:var(--press-s);padding:5px 14px;font:11.5px/1.55 var(--mono);color:var(--ink);white-space:pre-wrap;word-break:break-word;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.stream .in{overflow:hidden}
.stream .ph{color:var(--faint)}
.stream .end{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin-left:1px}
.stream .end .bar{width:2px;height:13px;background:var(--ink);animation:blink 1.1s steps(1) infinite}
.stream .end .dot{width:6px;height:6px}
.fbar.cancelled .stream,.fbar.error .stream{color:var(--soft)}
.fbar.error .stream{justify-content:center}
.prog{height:10px;border-radius:999px;box-shadow:var(--press-s);padding:2px;margin:0 4px}
.prog i{display:flex;justify-content:flex-end;align-items:center;padding-right:1px;height:100%;width:0;border-radius:999px;background:var(--s);box-shadow:var(--raise-xs);transition:width .6s var(--ease)}
.prog i .dot{width:4px;height:4px;box-shadow:none}
.prog i .dot.volt{box-shadow:0 0 5px rgba(198,255,61,.9)}
.hints{display:flex;align-items:center;gap:16px;height:26px;font-size:12px;color:var(--soft);padding-left:2px}
.hints > span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.hints .kc.xs{height:22px;min-width:22px;font-size:10.5px}
.th{margin-left:auto;display:flex;gap:10px;-webkit-app-region:no-drag}
.th .round{width:28px;height:28px}
.th .round svg{width:12px;height:12px}
/* brief view (chip clicked): takes the space of stream, progress and hints */
.brief{height:116px;border-radius:20px;box-shadow:var(--press-s);padding:10px 14px;overflow:auto;font-size:12px;line-height:1.45;color:var(--soft)}
.brief .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.brief .src{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;box-shadow:var(--raise-xs);font:500 10.5px/1 var(--mono);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brief .src em{font:600 9px/1 var(--round);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-style:normal}
.brief::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div class="fbar" id="bar">
  <div class="top">
    <div class="logo" id="logo"><img class="mark" src="mark.svg" alt=""></div>
    <div class="ttl"><b id="title">Maxxing</b><small id="sub"></small></div>
    <button class="chip" id="chip" title="Show the project brief and sources"><span class="dot uv"></span><span class="t" id="chipText">No project</span></button>
  </div>
  <div class="stream" id="stream"><div class="in selectable" id="text"></div></div>
  <div class="brief hidden selectable" id="brief"></div>
  <div class="prog" id="prog"><i id="fill"><span class="dot uv" id="pdot"></span></i></div>
  <div class="hints" id="hints">
    <span id="hEsc"><span class="kc xs">Esc</span><span id="escLabel">Cancel</span></span>
    <span id="hUndo"><span class="kc xs">⌘Z</span>Undo</span>
    <span id="hMax"><span id="maxKey"></span>Again for max</span>
    <div class="th">
      <button class="round" id="up" title="Good prompt" aria-label="Thumbs up"></button>
      <button class="round" id="down" title="Bad prompt" aria-label="Thumbs down"></button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
(async function () {
  const { $, esc, invoke, listen, engineLabel, keyCaps, ICON } = PMX;
  const bar = $("#bar");
  $("#up").innerHTML = ICON.up; $("#down").innerHTML = ICON.down;
  let phase = "start", thumb = null, briefOpen = false, cur = {};

  if ((await PMX.platform()) === "windows") $("#hUndo .kc").textContent = "Ctrl+Z";
  try { const s = await invoke("get_settings"); $("#maxKey").innerHTML = keyCaps(s.fast_key, "xs"); }
  catch (e) { $("#maxKey").innerHTML = keyCaps("Alt+Space", "xs"); }

  const MSG = {
    done: "Maxxed. Pasted in place.",
    clipboard: "Maxxed. It's on your clipboard.",
    error: "Couldn't maxx this one.",
    cancelled: "Cancelled.",
  };

  function sub(p) {
    const parts = [];
    if (p.engine) parts.push(engineLabel(p.engine) + (p.model ? " · " + p.model : ""));
    if (p.level === "max") parts.push("max");
    if ((p.phase === "done" || p.phase === "clipboard") && p.ms) parts.push((p.ms / 1000).toFixed(1) + " s");
    if (p.phase === "error" || p.phase === "cancelled") return "Your text is unchanged.";
    return parts.join(" · ");
  }

  function render(p) {
    cur = Object.assign({}, cur, p);
    p = cur;
    phase = p.phase;
    bar.className = "fbar " + phase;
    const fin = phase === "done" || phase === "clipboard";
    const bad = phase === "error" || phase === "cancelled";
    // title
    const title = MSG[phase] || ("Maxxing for " + (p.target || "this app"));
    $("#title").innerHTML = (fin ? '<span class="dot volt"></span>' : "") + esc(title);
    $("#sub").textContent = sub(p);
    $("#logo").innerHTML = phase === "error" ? '<span class="ic">!</span>' : '<img class="mark" src="mark.svg" alt="">';
    $("#chipText").textContent = p.chip || "No project";
    // stream
    const text = p.text || "";
    let html;
    if (phase === "start") html = '<span class="ph">Reading your text and project…</span><span class="end"><span class="bar"></span></span>';
    else if (phase === "delta") html = esc(text) + '<span class="end"><span class="bar"></span><span class="dot volt"></span></span>';
    else if (phase === "error") html = esc(p.message || "Something went wrong.");
    else if (phase === "cancelled") html = text ? esc(text) : '<span class="ph">Stopped before anything changed.</span>';
    else html = esc(text);
    $("#text").innerHTML = html;
    const s = $("#stream"); s.scrollTop = s.scrollHeight; $("#text").scrollTop = $("#text").scrollHeight;
    // progress: grey fill, Ultraviolet dot while working, Volt dot when maxxed
    const est = p.level === "max" ? 1400 : 520;
    const w = fin ? 100 : bad ? 0 : phase === "start" ? 6 : Math.min(92, 10 + (text.length / est) * 82);
    $("#fill").style.width = w + "%";
    $("#pdot").className = "dot " + (fin ? "volt" : "uv");
    $("#pdot").style.visibility = w ? "visible" : "hidden";
    // hints
    // After a run Esc is handed back to your app, so only show it while it can cancel.
    $("#hEsc").classList.toggle("hidden", fin || bad);
    $("#hUndo").classList.toggle("hidden", !(phase === "done"));
    $("#hMax").classList.toggle("hidden", fin || bad);
    $("#up").disabled = $("#down").disabled = !fin;
    if (phase === "start") thumb = null;
    $("#up").classList.toggle("on", thumb === true);
    $("#down").classList.toggle("on", thumb === false);
  }

  async function toggleBrief() {
    briefOpen = !briefOpen;
    $("#chip").classList.toggle("open", briefOpen);
    ["#stream", "#prog", "#hints"].forEach((s) => $(s).classList.toggle("hidden", briefOpen));
    $("#brief").classList.toggle("hidden", !briefOpen);
    if (!briefOpen) return;
    $("#brief").innerHTML = '<span style="color:var(--faint)">Loading…</span>';
    try {
      const c = await invoke("context_preview");
      const srcs = (c.sources || []).map((x) => `<span class="src" title="${esc(x.path)}"><em>${esc(x.level)}</em>${esc(x.path)}</span>`).join("");
      $("#brief").innerHTML = (srcs ? `<div class="srcs">${srcs}</div>` : "") + (c.brief ? esc(c.brief) : "No project brief. Only your About me notes are used.");
    } catch (e) { $("#brief").textContent = "Couldn't load the brief."; }
  }

  $("#chip").addEventListener("click", toggleBrief);
  $("#up").addEventListener("click", () => { thumb = true; invoke("bar_thumb", { up: true }); render({}); });
  $("#down").addEventListener("click", () => { thumb = false; invoke("bar_thumb", { up: false }); render({}); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); if (briefOpen) toggleBrief(); else invoke("bar_cancel"); }
    else if (e.metaKey && (e.key === "z" || e.key === "Z")) { e.preventDefault(); invoke("bar_undo"); }
  });

  await listen("pmx:bar", render);
  render({ phase: "start" });

  // ---------- browser preview: ?state=start|delta|done|clipboard|error|cancelled, none = loop ----------
  if (PMX.LIVE) return;
  const FULL = "Goal: find and fix why users are signed out of staging after about a minute.\nContext: shop repo. Run `pnpm test` before you say done. Do not push to main.\nSteps:\n1. Reproduce on staging with the test account and time the sign-out.\n2. Read the session code in app/auth/ and check the cookie max-age.\n3. Fix it and add a test that holds a session for 10 minutes.";
  const base = { level: "standard", engine: "claude-plan", model: "haiku", target: "Claude Code", chip: "shop · CLAUDE.md + 2 memories" };
  const emit = (p) => PMX.mockEmit("pmx:bar", Object.assign({}, base, p));
  const st = PMX.query.get("state");
  if (st === "brief") { emit({ phase: "delta", text: FULL.slice(0, 210) }); toggleBrief(); return; }
  if (st === "start") return emit({ phase: "start", text: "" });
  if (st === "delta") return emit({ phase: "delta", text: FULL.slice(0, 236) });
  if (st === "done") return emit({ phase: "done", text: FULL, ms: 1840 });
  if (st === "clipboard") return emit({ phase: "clipboard", text: FULL, ms: 1910, target: "Ghostty" });
  if (st === "error") return emit({ phase: "error", text: "", message: "Claude plan stopped answering after 20 s. Nothing was pasted." });
  if (st === "cancelled") return emit({ phase: "cancelled", text: FULL.slice(0, 120) });
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  for (;;) {
    emit({ phase: "start", text: "" }); await sleep(700);
    for (let i = 6; i <= FULL.length; i += 6) { emit({ phase: "delta", text: FULL.slice(0, i) }); await sleep(30); }
    emit({ phase: "done", text: FULL, ms: 1840 }); await sleep(2500);
  }
})();
</script>
</body>
</html>
