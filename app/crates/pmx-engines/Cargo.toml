[package]
name = "pmx-engines"
version = "0.1.0"
edition = "2021"
publish = false
description = "Promptmaxxer rewrite engines: any OpenAI-compatible API, Anthropic API key, Claude plan (Claude Code CLI), ChatGPT plan (Codex CLI), Google account (Gemini CLI)."

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[example]]
name = "rewrite"

[dev-dependencies]
tokio = { version = "1", features = ["signal"] }
